# Initial schema, run once by the postgres image on an empty data directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS chunks (
        id        TEXT PRIMARY KEY,          -- "<doc_id>#<chunk number>", e.g. "article-10#0"
        doc_id    TEXT NOT NULL,             -- document id from the SyntecRetrieval corpus
        title     TEXT NOT NULL,             -- article title, e.g. "Article 10 : Contrats à durée déterminée"
        content   TEXT NOT NULL,             -- chunk text (without the "passage: " prefix)
        embedding vector(384) NOT NULL       -- intfloat/multilingual-e5-small
    );

    CREATE INDEX IF NOT EXISTS chunks_embedding_hnsw
        ON chunks USING hnsw (embedding vector_cosine_ops);
